<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABC Decor Admin</title>

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;

}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:#F5F1EC;

}

.card{

background:white;

padding:40px;

border-radius:20px;

width:340px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

}

h2{

text-align:center;

margin-bottom:30px;

color:#6D4C41;

}

input{

width:100%;

padding:14px;

margin-bottom:15px;

border:1px solid #ddd;

border-radius:10px;

}

button{

width:100%;

padding:14px;

background:#6D4C41;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

font-size:16px;

}

button:hover{

background:#8D6E63;

}

</style>

</head>

<body>

<div class="card">

<h2>ABC Decor Admin</h2>

<form method="POST" action="/login">

<input
name="username"
placeholder="Tên đăng nhập"
required>

<input
type="password"
name="password"
placeholder="Mật khẩu"
required>

<button>

Đăng nhập

</button>

</form>

</div>

</body>

</html>
